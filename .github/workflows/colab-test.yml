name: Notebook compatibility

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook-compatibility:
    name: Notebook static and local compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install package with notebook extras
        run: uv sync --all-packages --extra notebook

      - name: Validate notebook structure and Python cells
        run: |
          uv run python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          import nbformat

          paths = [Path("soundlab.ipynb"), Path("notebooks/soundlab_studio.ipynb")]
          for path in paths:
              notebook = nbformat.read(path, as_version=4)
              nbformat.validate(notebook)
              ids = [cell.id for cell in notebook.cells]
              assert len(ids) == len(set(ids)), f"duplicate cell IDs in {path}"
              for index, cell in enumerate(notebook.cells):
                  if cell.cell_type != "code":
                      continue
                  source = cell.source
                  lines = []
                  for line in source.splitlines():
                      stripped = line.lstrip()
                      lines.append("pass" if stripped.startswith(("%", "!")) else line)
                  ast.parse("\n".join(lines) or "pass", filename=f"{path}:cell-{index}")
              print(f"validated {path}: {len(notebook.cells)} cells")
          PY

      - name: Test package imports
        run: |
          uv run python - <<'PY'
          import soundlab
          from soundlab import analysis, effects, pipeline, separation, transcription

          print(f"soundlab {soundlab.__version__}")
          print("core modules import successfully")
          PY

      - name: Test Gradio availability
        run: |
          uv run python - <<'PY'
          import gradio

          print(f"Gradio {gradio.__version__} available")
          PY

      - name: Evidence boundary
        run: |
          echo "This workflow validates files and local imports on GitHub Actions."
          echo "It is not managed-Colab, GPU, checkpoint, frontend-rendering, or perceptual evidence."
