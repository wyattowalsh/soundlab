name: Package build (publication disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  build:
    name: Build package artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build package
        run: uv build --package soundlab

      - name: Verify build artifacts
        run: |
          python - <<'PY'
          from pathlib import Path

          dist = Path("dist")
          sdists = list(dist.glob("*.tar.gz"))
          wheels = list(dist.glob("*.whl"))
          assert len(sdists) == 1, f"expected one sdist, found {len(sdists)}"
          assert len(wheels) == 1, f"expected one wheel, found {len(wheels)}"
          print(f"sdist: {sdists[0].name}")
          print(f"wheel: {wheels[0].name}")
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 5

  test-install:
    name: Test wheel installation (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }}
      - name: Install and import wheel
        run: |
          uv pip install --python .venv/bin/python dist/*.whl
          .venv/bin/python - <<'PY'
          import soundlab
          from soundlab import analysis, effects, separation, transcription

          print(f"SoundLab {soundlab.__version__} imports from the built wheel")
          PY

# Publication is intentionally disabled. The PyPI distribution name `soundlab`
# belongs to another project; selecting a distinct distribution identity requires
# an explicit, separately reviewed release decision.
